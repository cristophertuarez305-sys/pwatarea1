<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 8: Diseño responsivo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #a73499;
      margin: 0;
    }
    nav {
      background-color: #16c825;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav a {
      display: block;
      padding: 15px 20px;
      color: #fff;
      text-decoration: none;
    }
    nav a:hover {
      background-color: #050e1a;
    }
    nav a:active,
    nav a:focus {
      background-color: #e67e22;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      color: #1a4d8f;
      font-size: 2.5rem;
    }

    /* Tablets y pantallas medianas */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      nav a {
        padding: 12px 14px;
      }
    }

    /* Celulares */
    @media (max-width: 480px) {
      nav ul {
        flex-direction: column;
      }
      nav a {
        text-align: center;
        border-bottom: 1px solid #2f6fc4;
      }
      main {
        margin: 20px auto;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="ej05.html">Mi biografía</a></li>
      <li><a href="https://t.me/DCTV12" target="_blank">Telegram</a></li>
    </ul>
  </nav>

  <main>
    <h1>Bienvenido a mi página</h1>
    <p>Usa el menú de arriba para ir a mi biografía o visitar mi Telegram.</p>
  </main>

</body>
</html>

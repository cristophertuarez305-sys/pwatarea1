<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4: Formulario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #d60c1d;
      color: #1e5704;
      margin: 0;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      color: #07efc9;
    }
    form, #resultado {
      max-width: 400px;
      margin: 20px auto;
      background: #fff;
      border: 1px solid #ccd6e4;
      border-radius: 8px;
      padding: 20px;
    }
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #999;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #1a4d8f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #4ad107;
    }
    #resultado {
      display: none;
      border-color: #2e8b57;
      background-color: #0ad458;
    }
  </style>
</head>
<body>

  <h1>Formulario de datos</h1>

  <form action="ej04.html" method="get">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" required>

    <label for="edad">Edad</label>
    <input type="number" id="edad" name="edad" min="1" max="120" required>

    <button type="submit">Enviar</button>
  </form>

  <div id="resultado">
    <h2>¡Datos recibidos!</h2>
    <p><strong>Nombre:</strong> <span id="rNombre"></span></p>
    <p><strong>Correo:</strong> <span id="rCorreo"></span></p>
    <p><strong>Edad:</strong> <span id="rEdad"></span></p>
  </div>

  <script>
    var datos = new URLSearchParams(window.location.search);
    if (datos.has("nombre")) {
      document.getElementById("rNombre").textContent = datos.get("nombre");
      document.getElementById("rCorreo").textContent = datos.get("correo");
      document.getElementById("rEdad").textContent = datos.get("edad");
      document.getElementById("resultado").style.display = "block";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3: Tablas</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #e78080;
    }
  </style>
</head>
<body>

  <h1>Países y capitales</h1>

  <table>
    <thead>
      <tr>
        <th>N.º</th>
        <th>País</th>
        <th>Capital</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Ecuador</td>
        <td>Quito</td>
      </tr>
      <tr>
        <td>2</td>
        <td>España</td>
        <td>Madrid</td>
      </tr>
      <tr>
        <td>3</td>
        <td>EE.UU.</td>
        <td>Washington D.C.</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
